[build-system]
# Standard build backend for modern Python packaging
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TANTRA"
version = "1.0.0"
description = "A protocol-oriented NLP library for structural, semantic, and logical text analysis"
readme = "README.md"
authors = [{ name = "DevUser", email = "dev@example.com" }]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
# Classical & statistical NLP
classic = ["nltk>=3.8", "scikit-learn>=1.3"]
# Vector math
vector = ["numpy>=1.26", "scipy>=1.11"]

[tool.setuptools]
package-dir = { "" = "src/bavans" }

[tool.setuptools.packages.find]
where = ["src/bavans"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--import-mode=importlib --strict-markers"